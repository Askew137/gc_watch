# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# App version: one place for both apps (phone and watch must stay in sync).
# Bump both for a release; the updater compares versionName with the GitHub release tag.
gcwatch.versionName=1.0.15
gcwatch.versionCode=16
